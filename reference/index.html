
<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Art Tales by Aashwi Maheshwari</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#4A148C",
              "primary-light": "#7c43bd",
              "secondary": "#F8BBD0",
              "secondary-dark": "#F06292",
              "accent": "#FEFCF3",
              "background-soft": "#fcfafc"
            },
            fontFamily: {
              "display": ["Plus Jakarta Sans", "sans-serif"]
            },
            backgroundImage: {
              'resin-swirl': "radial-gradient(at 10% 10%, hsla(305,49%,96%,0.8) 0, transparent 50%), radial-gradient(at 90% 10%, hsla(285,45%,93%,0.8) 0, transparent 50%), radial-gradient(at 90% 90%, hsla(320,55%,94%,0.8) 0, transparent 50%), radial-gradient(at 10% 90%, hsla(278,41%,92%,0.8) 0, transparent 50%), radial-gradient(at 50% 50%, hsla(330,55%,98%,0.8) 0, transparent 50%)",
              'resin-shine': 'linear-gradient(125deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.1) 30%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.1) 100%)',
              'resin-depth': 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2) 0%, rgba(0,0,0,0.05) 100%)',
            },
            boxShadow: {
              'glass-inset': 'inset 0 0 20px rgba(255, 255, 255, 0.5), inset 0 0 5px rgba(255, 255, 255, 0.3), 0 5px 15px rgba(0,0,0,0.1)',
              'resin-card': '0 10px 30px -5px rgba(74, 20, 140, 0.15), inset 0 1px 1px rgba(255,255,255,0.8), inset 0 -1px 20px rgba(255,255,255,0.3)',
              'resin-hover': '0 20px 40px -5px rgba(74, 20, 140, 0.25), inset 0 1px 1px rgba(255,255,255,0.9), inset 0 -1px 20px rgba(255,255,255,0.4)',
              'resin-block': 'inset 1px 1px 0px rgba(255, 255, 255, 0.6), inset -1px -1px 0px rgba(0, 0, 0, 0.05), 0 10px 30px -5px rgba(74, 20, 140, 0.1), 0 4px 6px -2px rgba(74, 20, 140, 0.05)',
              'gem': 'inset 2px 2px 4px rgba(255,255,255,0.9), inset -2px -2px 4px rgba(74,20,140,0.1), 2px 4px 8px rgba(74,20,140,0.15)',
              'btn-glass': 'inset 1px 1px 0 rgba(255, 255, 255, 0.7), inset -1px -1px 0 rgba(74, 20, 140, 0.1), 0 4px 12px rgba(74, 20, 140, 0.25)',
            },
            animation: {
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
      @layer utilities {
        .glass-panel {
          @apply bg-white/20 backdrop-blur-xl border border-white/40 shadow-resin-block relative overflow-hidden;
        }
        .btn-resin {
          @apply relative overflow-hidden transition-all duration-300 active:scale-95 text-white bg-primary shadow-btn-glass hover:shadow-lg hover:-translate-y-[1px];
        }
        .btn-resin-secondary {
          @apply relative overflow-hidden transition-all duration-300 active:scale-95 text-primary bg-white/40 backdrop-blur-md shadow-btn-glass border border-white/60 hover:bg-white/60 hover:shadow-lg hover:-translate-y-[1px];
        }
        .resin-glass {
          @apply bg-white/60 backdrop-blur-[20px] border border-white/70 shadow-[0_20px_40px_-10px_rgba(74,20,140,0.15),inset_0_0_0_1px_rgba(255,255,255,0.3),inset_2px_2px_20px_rgba(255,255,255,0.5)];
          border-top: 1px solid rgba(255, 255, 255, 0.9);
          border-left: 1px solid rgba(255, 255, 255, 0.9);
        }
        .resin-embedded {
          @apply bg-white/40 backdrop-blur-[16px] border border-white/60 shadow-[inset_1px_1px_5px_rgba(255,255,255,0.8),inset_-2px_-2px_10px_rgba(74,20,140,0.05),0_10px_30px_-5px_rgba(74,20,140,0.1)];
        }
        .resin-bubble {
          @apply relative overflow-hidden bg-[radial-gradient(110%_110%_at_20%_20%,rgba(255,255,255,0.9)_0%,rgba(255,255,255,0.4)_50%,rgba(255,255,255,0.2)_100%)] backdrop-blur-[12px] border border-white/60 shadow-[0_15px_35px_rgba(74,20,140,0.15),inset_2px_2px_5px_rgba(255,255,255,1),inset_-2px_-2px_10px_rgba(0,0,0,0.03)] transition-all duration-[0.4s] cursor-default;
        }
        .resin-bubble:hover {
          @apply -translate-y-2 scale-[1.02] shadow-[0_25px_50px_rgba(74,20,140,0.2),inset_2px_2px_5px_rgba(255,255,255,1)] z-10;
        }
        .resin-bubble::after {
          content: '';
          @apply absolute top-[10%] left-[10%] w-[35%] h-[20%] rounded-[50%] bg-[radial-gradient(ellipse_at_center,rgba(255,255,255,0.95)_0%,rgba(255,255,255,0)_70%)] rotate-[-45deg] pointer-events-none opacity-90 blur-[2px];
        }
        .bubble-1 { border-radius: 40px 100px 40px 100px / 100px 40px 100px 40px; }
        .bubble-2 { border-radius: 100px 40px 100px 40px / 40px 100px 40px 100px; }
        .bubble-3 { border-radius: 60px 80px 40px 80px / 80px 40px 80px 60px; }
        .resin-image-frame {
          @apply relative p-[14px] bg-white/25 rounded-[3rem] shadow-[inset_1px_1px_4px_rgba(255,255,255,0.8),inset_-2px_-2px_6px_rgba(0,0,0,0.05),10px_10px_30px_rgba(74,20,140,0.15)] backdrop-blur-[6px] border border-white/50;
        }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-background-soft font-display text-slate-800">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
